name: android-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint + Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Prepare CI Firebase stub
        run: |
          bash scripts/generate-ci-google-services.sh
          echo "google.web_client_id=ci-placeholder.apps.googleusercontent.com" >> local.properties
      - name: Android Lint
        run: ./gradlew lintDebug --no-configuration-cache
      - name: Detekt
        run: ./gradlew detekt --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Prepare CI Firebase stub
        run: |
          bash scripts/generate-ci-google-services.sh
          echo "google.web_client_id=ci-placeholder.apps.googleusercontent.com" >> local.properties
      - run: ./gradlew test assembleDebug jacocoDebugUnitTestReport jacocoDebugUnitTestCoverageVerification --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: |
            app/build/reports/jacoco/jacocoDebugUnitTestReport/
            app/build/reports/tests/testDebugUnitTest/

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - name: Instrumented tests placeholder
        run: |
          echo "Compose UI smoke tests run in the unit-tests job (Robolectric)."
          echo "Re-enable connectedDebugAndroidTest here when E2E instrumented coverage is needed."

  release-r8:
    name: Release R8 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Prepare CI release keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -storepass ci-release \
            -keypass ci-release \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI, OU=Mobile, O=C2C Market, L=Local, ST=Local, C=CN"
          cat > keystore.properties <<'EOF'
          storeFile=keystore/release.jks
          storePassword=ci-release
          keyPassword=ci-release
          keyAlias=release
          EOF
      - name: Prepare CI Firebase stub
        run: |
          bash scripts/generate-ci-google-services.sh
          echo "google.web_client_id=ci-placeholder.apps.googleusercontent.com" >> local.properties
      - run: ./gradlew assembleRelease --no-configuration-cache

name: android-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint + Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - name: Android Lint
        run: ./gradlew lintDebug --no-configuration-cache
      - name: Detekt
        run: ./gradlew detekt --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew test assembleDebug jacocoDebugUnitTestReport jacocoDebugUnitTestCoverageVerification --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: |
            app/build/reports/jacoco/jacocoDebugUnitTestReport/
            app/build/reports/tests/testDebugUnitTest/

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - name: Run connected tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-configuration-cache

  release-r8:
    name: Release R8 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - name: Prepare CI release keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -storepass ci-release \
            -keypass ci-release \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI, OU=Mobile, O=C2C Market, L=Local, ST=Local, C=CN"
          cat > keystore.properties <<'EOF'
          storeFile=keystore/release.jks
          storePassword=ci-release
          keyPassword=ci-release
          keyAlias=release
          EOF
      - run: ./gradlew assembleRelease --no-configuration-cache
